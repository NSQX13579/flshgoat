description: wordle猜单词游戏
manage: false
matchers: []
module_name: nonebot_plugin_wordle
name: 猜单词
priority: 99
sharding: false
show: true
usage: '@我 + “猜单词”开始游戏；

  答案为指定长度单词，发送对应长度单词即可；

  绿色块代表此单词中有此字母且位置正确；

  黄色块代表此单词中有此字母，但该字母所处位置不对；

  灰色块代表此单词中没有此字母；

  猜出单词或用光次数则游戏结束；

  发送“结束”结束游戏；发送“提示”查看提示；

  可使用 -l/--length 指定单词长度，默认为5；

  可使用 -d/--dictionary 指定词典，默认为CET4

  支持的词典：专八、TOEFL、CET4、GMAT、考研、SAT、GRE、专四、IELTS、CET6'
