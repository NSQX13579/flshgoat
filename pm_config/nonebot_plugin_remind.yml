description: 符合中国宝宝体质的定时提醒功能~
manage: false
matchers: []
module_name: nonebot_plugin_remind
name: 定时提醒
priority: 99
sharding: false
show: true
usage: '【命令匹配】

  /remind   设置定时提醒

  /提醒列表   查看当前所有定时任务：只能查看当前群聊定时的任务，私聊私聊可查看全部任务

  /删除提醒   删除定时任务，例如参数为"1 3-6"时表示删除任务ID为13456这些提醒任务。当参数为"all"时删除当前群全部定时任务。

  【关键词匹配】：提醒

  [@][时间]''提醒''[被提醒人][消息]

  例如“@机器人 22.35提醒我和@用户1 @用户2 去吃夜宵”

  可以用“all”或者“所有人”来代替 @全体成员 ，避免影响别人。


  支持的时间格式有：

  %Y-%m-%d-%H:%M

  %m.%d.%H:%M

  %m.%d.%H.%M

  %H:%M

  %H.%M'
