description: 汉字Wordle 猜成语
manage: false
matchers: []
module_name: nonebot_plugin_handle
name: 猜成语
priority: 99
sharding: false
show: true
usage: '@我 + “猜成语”开始游戏；

  你有十次的机会猜一个四字词语；

  每次猜测后，汉字与拼音的颜色将会标识其与正确答案的区别；

  青色 表示其出现在答案中且在正确的位置；

  橙色 表示其出现在答案中但不在正确的位置；

  每个格子的 汉字、声母、韵母、声调 都会独立进行颜色的指示。

  当四个格子都为青色时，你便赢得了游戏！

  可发送“结束”结束游戏；可发送“提示”查看提示。

  使用 --strict 选项开启非默认的成语检查，即猜测的短语必须是成语，

  如：猜成语 --strict'
