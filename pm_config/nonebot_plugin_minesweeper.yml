description: 扫雷游戏
manage: false
matchers: []
module_name: nonebot_plugin_minesweeper
name: 扫雷
priority: 99
sharding: false
show: true
usage: '@我 + 扫雷 开始游戏；

  @我 + 扫雷初级 / 扫雷中级 / 扫雷高级 可开始不同难度的游戏；

  可使用 -r/--row ROW 、-c/--col COL 、-n/--num NUM 自定义行列数和雷数；

  可使用 -s/--skin SKIN 指定皮肤，默认为 winxp；

  使用 挖开/open + 位置 来挖开方块，可同时指定多个位置；

  使用 标记/mark + 位置 来标记方块，可同时指定多个位置；

  位置为 字母+数字 的组合，如“A1”；

  发送 查看游戏 查看当前游戏状态；

  发送 结束 结束游戏；

  '
