description: 利用群消息生成词云
manage: false
matchers: []
module_name: nonebot_plugin_wordcloud
name: 词云
priority: 99
sharding: false
show: true
usage: '- 通过快捷命令，以获取常见时间段内的词云

  格式：/<时间段>词云

  时间段关键词有：今日，昨日，本周，上周，本月，上月，年度

  示例：/今日词云，/昨日词云


  - 提供日期与时间，以获取指定时间段内的词云（支持 ISO8601 格式的日期与时间，如 2022-02-22T22:22:22）

  格式：/历史词云 [日期或时间段]

  示例：/历史词云

  /历史词云 2022-01-01

  /历史词云 2022-01-01~2022-02-22

  /历史词云 2022-02-22T11:11:11~2022-02-22T22:22:22


  - 在上方所给的命令格式基础上，还可以添加前缀“我的”，以获取自己的词云

  格式：/我的<基本命令格式>

  示例：/我的今日词云

  /我的昨日词云


  - 设置自定义词云形状

  格式：/设置词云形状

  /设置词云形状


  - 设置默认词云形状（仅超级用户）

  格式：/设置词云默认形状

  /删除词云默认形状


  - 设置定时发送每日词云

  格式：/词云每日定时发送状态

  /开启词云每日定时发送

  /开启词云每日定时发送 23:59

  /关闭词云每日定时发送'
